[meta]
schedule = https://cfp.2026.matrix.org/matrix-conference-2026/schedule/export/schedule.xml
template = 0001-0200.mkv
alpha = false
prores = false
inout_type = t
fade_duration = 0.25

[default]

fontfile = HelveticaNeueMedium.ttf
fontcolor = #ffffff

[title]
in = 2
out = 6
fontsize = 50
x = 50
y = 200

[speaker]
in = 3
out = 6
fontsize = 40
x = 50
y = 400

;; optional extra text, comment out "text" field to disable
[text]
in = 0
out = 0
fontsize = 0
x = 0
y = 0
